<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            padding: 50px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        .projects {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .project {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .project h2 {
            margin-bottom: 10px;
        }

        .project p {
            color: #666;
            margin-bottom: 20px;
        }

        .project a {
            display: inline-block;
            padding: 10px 18px;
            background: #24292f;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .project a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <h1>My Projects</h1>

    <div class="projects">

        <div class="project">
            <h2>Job Application Tracker</h2>
            <p>A web application to track job applications.</p>

            <a href="./Job%20Application%20Tracker/">
                View Live
            </a>
        </div>

    </div>

</body>
</html>
